<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Kalender von Naser Solutions</title>

  <link rel="stylesheet" href="style.css">

  <!-- defer: JavaScript startet erst, wenn das HTML geladen wurde -->
  <script src="script.js" defer></script>
</head>

<body>
  <main class="seite">
    <header class="brand-header">

    <a
        href="https://www.naser.solutions"
        target="_blank"
        class="brand-link"
    >
        <img
            src="assets/logo3.jpeg"
            alt="Naser Solutions"
            class="brand-logo"
        >
    </a>

    <span class="brand-label">
        WEB AGENCY
    </span>

</header>

    <section class="einleitung">
      <p class="kategorie">Naser Solutions Kalender</p>

      <h1 id="main-headline">
        Kalenderblatt
      </h1>

      <!-- Dieser Text wird vollständig mit JavaScript eingesetzt -->
      <p id="tagesbeschreibung"></p>
    </section>

    <section class="kalender-bereich">
      <div class="tabelle">

        <div class="kalender-kopf">
          <div>
            <p class="website-hinweis">
              Besuch uns auf
              <a
                href="https://www.naser.solutions"
                target="_blank"
                rel="noopener noreferrer"
              >
                naser.solutions
              </a>
            </p>

            <h2 id="monats-ueberschrift"></h2>
          </div>
        </div>

        <table aria-label="Kalender des aktuellen Monats">
          <thead>
            <tr>
              <th>Mo</th>
              <th>Di</th>
              <th>Mi</th>
              <th>Do</th>
              <th>Fr</th>
              <th class="samstag">Sa</th>
              <th class="sonntag">So</th>
            </tr>
          </thead>

          <!-- Die Kalendertage erzeugt JavaScript -->
          <tbody id="kalender-inhalt"></tbody>
        </table>
      </div>
    </section>

  <section class="historie">
    <p class="kategorie">Historische Ereignisse</p>

    <h2 id="history-title">
        Historische Ereignisse
    </h2>

    <ul id="history-list"></ul>
</section>
  </main>
</body>
</html>
